name: Maintenance email reports

# Two self-gating, idempotent email reports to maintenance:
#   * /cron/spare-reorder-report — month-END reorder summary (last day, 3pm IST)
#   * /cron/maint-review-report  — month-START breakdown review (1st, 9am IST)
#
# Not Vercel crons: Hobby caps crons at 2 and both are in use. This pings hourly;
# each endpoint self-gates to its day/time and is idempotent per month, so the
# extra hourly hits are harmless no-ops. Hourly (not a single daily run) because
# GitHub's scheduler is best-effort and can drift by hours; a wide window plus
# the once-a-month guard means each report still lands.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Ping maintenance report endpoints
        run: |
          ping() {
            local path="$1"
            hit() {
              curl -sS --max-time 70 -o /tmp/resp.txt -w "%{http_code}" \
                "https://app.metfraa.com${path}" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo "000"
            }
            code=$(hit)
            echo "== ${path} -> HTTP $code"; cat /tmp/resp.txt; echo
            if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
              echo "::warning::${path} returned $code - retrying in 20s"
              sleep 20
              code=$(hit)
              echo "retry ${path} -> HTTP $code"; cat /tmp/resp.txt; echo
            fi
            if [ "$code" -ge 400 ] && [ "$code" -lt 500 ]; then
              echo "::error::${path} returned $code - check CRON_SECRET / route"; return 1
            fi
            if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
              echo "::warning::${path} still $code - idempotent, next run catches up"
            fi
            return 0
          }
          rc=0
          ping "/cron/spare-reorder-report" || rc=1
          ping "/cron/maint-review-report" || rc=1
          exit $rc
