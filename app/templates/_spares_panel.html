<div x-data="sparesApp()" x-init="init()" x-cloak>

  <input type="file" x-ref="ocrFile" accept="image/*" capture="environment" class="hidden" @change="onOcrFile($event)">
  <input type="file" x-ref="ocrGallery" accept="image/*" multiple class="hidden" @change="onOcrFile($event)">

  <!-- KPI tiles -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-lg ring-1 ring-metfraa-gray-200 p-5">
      <div class="lbl">Parts</div>
      <div class="text-3xl font-bold text-metfraa-ink mono mt-1" x-text="totals.parts ?? 0"></div>
    </div>
    <div class="bg-white rounded-lg ring-1 ring-metfraa-gray-200 p-5">
      <div class="lbl">Total units in stock</div>
      <div class="text-3xl font-bold text-metfraa-ink mono mt-1" x-text="(totals.total_units ?? 0).toLocaleString('en-IN')"></div>
    </div>
    <div class="bg-white rounded-lg ring-1 ring-metfraa-gray-200 p-5">
      <div class="lbl">Stock value</div>
      <div class="text-3xl font-bold text-metfraa-blue mono mt-1">₹<span x-text="(totals.stock_value ?? 0).toLocaleString('en-IN',{maximumFractionDigits:0})"></span></div>
    </div>
    <div class="bg-white rounded-lg ring-1 ring-metfraa-gray-200 p-5 cursor-pointer"
         :class="onlyReorder ? 'ring-2 ring-red-400' : ''" @click="onlyReorder = !onlyReorder; load()">
      <div class="lbl">Reorder now</div>
      <div class="text-3xl font-bold mono mt-1" :class="(totals.reorder_count ?? 0) ? 'text-red-600' : 'text-metfraa-ink'" x-text="totals.reorder_count ?? 0"></div>
      <div class="text-[11px] text-metfraa-gray-400 mt-0.5" x-text="onlyReorder ? 'showing reorder only — click to clear' : 'click to filter'"></div>
    </div>
  </div>

  <!-- toolbar -->
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <input type="search" x-model.debounce.350ms="q" @input="load()"
           placeholder="Search part, code, machine, supplier…"
           class="text-sm rounded-lg border-metfraa-gray-300 w-72">
    <div class="flex-1"></div>
    <button @click="openAdd()" class="px-4 py-2 rounded-lg bg-metfraa-blue text-white text-sm font-bold">+ Add part</button>
  </div>

  <!-- Month-end reorder report tracker -->
  <div class="bg-white rounded-lg ring-1 ring-metfraa-gray-200 p-4 mb-4 flex flex-wrap items-center gap-x-6 gap-y-2">
    <div>
      <div class="lbl">Month-end reorder report</div>
      <div class="text-sm text-metfraa-ink mt-0.5">
        <template x-if="report.last_sent">
          <span>
            <span class="inline-block w-2 h-2 rounded-full align-middle mr-1"
                  :class="report.sent_this_month ? 'bg-green-500' : 'bg-amber-400'"></span>
            Last sent <b x-text="report.last_sent"></b>
            <span class="text-metfraa-gray-500" x-text="report.last_count ? '· ' + report.last_count + ' part(s)' : ''"></span>
            <span class="text-metfraa-gray-500" x-text="report.to ? '· to ' + report.to : ''"></span>
          </span>
        </template>
        <template x-if="!report.last_sent">
          <span class="text-metfraa-gray-500">
            <span class="inline-block w-2 h-2 rounded-full bg-metfraa-gray-300 align-middle mr-1"></span>
            Not sent yet
          </span>
        </template>
      </div>
      <div class="text-[11px] text-metfraa-gray-400 mt-0.5">
        Emailed automatically — <span x-text="report.schedule || 'last day of month, 3 PM IST'"></span>.
        <span x-show="(report.reorder_now ?? 0) > 0" class="text-red-600 font-semibold" x-text="report.reorder_now + ' part(s) in reorder now'"></span>
      </div>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-2">
      <span x-show="reportMsg" class="text-xs font-semibold"
            :class="reportMsgOk ? 'text-green-600' : 'text-red-600'" x-text="reportMsg"></span>
      <button @click="sendReport()" :disabled="reportSending"
              class="px-3 py-2 rounded-lg ring-1 ring-metfraa-blue text-metfraa-blue text-sm font-bold hover:bg-metfraa-blue hover:text-white disabled:opacity-50">
        <span x-show="!reportSending">Send now</span><span x-show="reportSending">Sending…</span>
      </button>
    </div>
  </div>

  <!-- table -->
  <div class="bg-white rounded-lg ring-1 ring-metfraa-gray-200 overflow-x-auto">
    <table class="w-full text-sm whitespace-nowrap">
      <thead>
        <tr class="text-left lbl border-b border-metfraa-gray-100">
          <th class="py-2.5 px-3">Part</th>
          <th class="py-2.5 px-3">Machine</th>
          <th class="py-2.5 px-3 text-right">Stock</th>
          <th class="py-2.5 px-3 text-right">Min</th>
          <th class="py-2.5 px-3">Status</th>
          <th class="py-2.5 px-3 text-right">Price</th>
          <th class="py-2.5 px-3 text-right">Value</th>
          <th class="py-2.5 px-3">Supplier</th>
          <th class="py-2.5 px-3">Store location</th>
          <th class="py-2.5 px-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-metfraa-gray-100">
        <template x-for="r in rows" :key="r.id">
          <tr class="hover:bg-metfraa-gray-50">
            <td class="py-2 px-3">
              <div class="font-semibold text-metfraa-ink" x-text="r.part_name"></div>
              <div class="text-[11px] text-metfraa-gray-400">
                <span x-show="r.part_code" x-text="r.part_code"></span>
                <span x-show="r.manufacturer" x-text="(r.part_code ? ' · ' : '') + r.manufacturer"></span>
              </div>
            </td>
            <td class="py-2 px-3 text-metfraa-gray-600" x-text="r.machine || '—'"></td>
            <td class="py-2 px-3 text-right mono font-semibold"
                :class="r.reorder_status === 'REORDER NOW' ? 'text-red-600' : ''">
              <span x-text="r.current_stock.toLocaleString('en-IN')"></span>
              <span class="text-[11px] text-metfraa-gray-400" x-text="r.unit || ''"></span>
            </td>
            <td class="py-2 px-3 text-right mono text-metfraa-gray-500" x-text="r.min_stock_level.toLocaleString('en-IN')"></td>
            <td class="py-2 px-3">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase"
                    :class="r.reorder_status === 'REORDER NOW' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'"
                    x-text="r.reorder_status"></span>
            </td>
            <td class="py-2 px-3 text-right mono" x-text="r.unit_price ? '₹'+r.unit_price.toLocaleString('en-IN') : '—'"></td>
            <td class="py-2 px-3 text-right mono" x-text="r.stock_value ? '₹'+r.stock_value.toLocaleString('en-IN',{maximumFractionDigits:0}) : '—'"></td>
            <td class="py-2 px-3 text-metfraa-gray-600" x-text="r.supplier || '—'"></td>
            <td class="py-2 px-3 text-metfraa-gray-600" x-text="r.store_location || '—'"></td>
            <td class="py-2 px-3 text-right">
              <div class="inline-flex gap-1">
                <button @click="openMove(r,'in')"  title="Stock in"  class="w-7 h-7 rounded ring-1 ring-green-300 text-green-700 font-bold">+</button>
                <button @click="openMove(r,'out')" title="Stock out" class="w-7 h-7 rounded ring-1 ring-amber-300 text-amber-700 font-bold">−</button>
                <button @click="openEdit(r)" title="Edit" class="w-7 h-7 rounded ring-1 ring-metfraa-gray-300 text-metfraa-gray-600">✎</button>
                <button @click="del(r)" title="Remove" class="w-7 h-7 rounded ring-1 ring-red-200 text-red-500">✕</button>
              </div>
            </td>
          </tr>
        </template>
        <tr x-show="!rows.length">
          <td colspan="10" class="py-10 text-center text-metfraa-gray-400 text-sm">No parts found.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- add / edit modal -->
  <div x-show="showForm" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40" @click.self="showForm=false">
    <div class="bg-white rounded-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="display text-xl text-metfraa-ink" x-text="form.id ? 'Edit part' : 'Add part'"></h3>
        <button @click="showForm=false" class="text-metfraa-gray-400 text-2xl leading-none">&times;</button>
      </div>

      <!-- Fill from a photo (OCR) -->
      <div class="flex flex-wrap items-center gap-x-3 gap-y-2 mb-4 bg-metfraa-blue/5 border border-metfraa-blue/20 rounded-lg px-3 py-2">
        <span class="lbl">Fill from a photo</span>
        <button @click="ocrScan()" :disabled="ocrBusy" type="button"
                class="text-sm font-semibold text-metfraa-blue hover:underline disabled:opacity-40"
                x-text="ocrBusy ? 'Reading…' : '📷 Add scan'"></button>
        <button @click="ocrUpload()" :disabled="ocrBusy" type="button"
                class="text-sm font-semibold text-metfraa-blue hover:underline disabled:opacity-40">🖼️ Add photos</button>
        <template x-if="ocrQueue.length">
          <span class="flex items-center gap-2">
            <span class="text-xs font-semibold text-metfraa-blue" x-text="ocrQueue.length + ' photo' + (ocrQueue.length>1?'s':'') + ' ready'"></span>
            <button @click="extractOcr()" :disabled="ocrBusy" type="button" class="text-xs font-semibold px-3 py-1 rounded-lg bg-metfraa-blue text-white disabled:opacity-40" x-text="ocrBusy ? 'Reading…' : 'Extract & fill'"></button>
            <button @click="clearOcrQueue()" :disabled="ocrBusy" type="button" class="text-xs font-semibold text-metfraa-gray-500 hover:underline">Clear</button>
          </span>
        </template>
        <span x-show="ocrMsg" class="text-xs font-semibold basis-full" :class="ocrMsgOk ? 'text-green-600' : 'text-metfraa-gray-500'" x-text="ocrMsg"></span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="block"><span class="lbl">Part name *</span>
          <input x-model="form.part_name" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Part code</span>
          <input x-model="form.part_code" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Machine / Equipment</span>
          <input x-model="form.machine" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Manufacturer</span>
          <input x-model="form.manufacturer" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Unit</span>
          <input x-model="form.unit" placeholder="No, Set, Mtr…" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Supplier</span>
          <input x-model="form.supplier" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Store location</span>
          <input x-model="form.store_location" placeholder="Rack / bin / store" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        <label class="block"><span class="lbl">Opening qty</span>
          <input type="number" step="any" x-model.number="form.opening_qty" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
        <label class="block"><span class="lbl">Min stock level</span>
          <input type="number" step="any" x-model.number="form.min_stock_level" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
        <label class="block"><span class="lbl">Qty in</span>
          <input type="number" step="any" x-model.number="form.qty_in" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
        <label class="block"><span class="lbl">Qty out</span>
          <input type="number" step="any" x-model.number="form.qty_out" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
        <label class="block"><span class="lbl">Unit price (₹)</span>
          <input type="number" step="any" x-model.number="form.unit_price" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
        <label class="block"><span class="lbl">Last purchase date</span>
          <input type="date" x-model="form.last_purchase_date" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
      </div>
      <p x-show="formErr" class="text-sm text-red-600 mt-3" x-text="formErr"></p>
      <div class="flex justify-end gap-2 mt-5">
        <button @click="showForm=false" class="px-4 py-2 rounded-lg ring-1 ring-metfraa-gray-300 text-sm font-bold">Cancel</button>
        <button @click="save()" :disabled="saving" class="px-5 py-2 rounded-lg bg-metfraa-blue text-white text-sm font-bold disabled:opacity-50" x-text="saving?'Saving…':'Save'"></button>
      </div>
    </div>
  </div>

  <!-- stock move modal -->
  <div x-show="showMove" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40" @click.self="showMove=false">
    <div class="bg-white rounded-xl w-full max-w-sm p-6">
      <h3 class="display text-xl text-metfraa-ink mb-1" x-text="(move.direction==='in'?'Stock in':'Stock out')"></h3>
      <p class="text-sm text-metfraa-gray-500 mb-4"><span x-text="move.part_name"></span> · in stock: <span class="mono font-semibold" x-text="move.current"></span></p>
      <label class="block mb-3"><span class="lbl">Quantity</span>
        <input type="number" step="any" min="0" x-model.number="move.qty" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
      <template x-if="move.direction==='in'">
        <div class="grid grid-cols-2 gap-3 mb-1">
          <label class="block"><span class="lbl">Unit price (₹)</span>
            <input type="number" step="any" x-model.number="move.unit_price" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300 mono"></label>
          <label class="block"><span class="lbl">Purchase date</span>
            <input type="date" x-model="move.purchase_date" class="mt-1 w-full text-sm rounded-lg border-metfraa-gray-300"></label>
        </div>
      </template>
      <p x-show="moveErr" class="text-sm text-red-600 mt-2" x-text="moveErr"></p>
      <div class="flex justify-end gap-2 mt-5">
        <button @click="showMove=false" class="px-4 py-2 rounded-lg ring-1 ring-metfraa-gray-300 text-sm font-bold">Cancel</button>
        <button @click="doMove()" :disabled="saving" class="px-5 py-2 rounded-lg text-white text-sm font-bold disabled:opacity-50"
                :class="move.direction==='in'?'bg-green-600':'bg-amber-600'" x-text="saving?'…':(move.direction==='in'?'Add stock':'Issue stock')"></button>
      </div>
    </div>
  </div>

</div>

<script>
function sparesApp() {
  return {
    rows: [], totals: {}, q: '', onlyReorder: false,
    showForm: false, saving: false, formErr: '',
    form: {},
    showMove: false, moveErr: '', move: {},
    report: {}, reportSending: false, reportMsg: '', reportMsgOk: false,
    ocrBusy: false, ocrQueue: [], ocrMsg: '', ocrMsgOk: false,

    init() { this.load(); this.loadReportStatus(); },

    // -------- Add a part from a photo (OCR) --------
    ocrScan() { this.$refs.ocrFile.value = ''; this.$refs.ocrFile.click(); },
    ocrUpload() { this.$refs.ocrGallery.value = ''; this.$refs.ocrGallery.click(); },
    clearOcrQueue() { this.ocrQueue = []; this.ocrMsg = ''; },
    downscaleImage(file, maxDim) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const s = Math.min(1, maxDim / Math.max(w, h));
          const c = document.createElement('canvas');
          c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    },
    async onOcrFile(ev) {
      const files = [...(ev.target.files || [])];
      for (const f of files) {
        try { this.ocrQueue.push(await this.downscaleImage(f, 1568)); } catch (e) {}
      }
      this.ocrMsgOk = false;
      this.ocrMsg = this.ocrQueue.length
        ? (this.ocrQueue.length + ' photo' + (this.ocrQueue.length > 1 ? 's' : '') + ' ready — tap “Extract & fill”')
        : '';
    },
    async extractOcr() {
      if (!this.ocrQueue.length) { this.ocrMsgOk = false; this.ocrMsg = 'Add a photo first'; return; }
      this.ocrBusy = true; this.ocrMsg = 'Reading…'; this.ocrMsgOk = false;
      try {
        const r = await fetch('/maint/api/ocr/extract', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'spare', images: this.ocrQueue }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Scan failed');
        const f = d.fields || {};
        for (const k in f) { if (k in this.form) this.form[k] = f[k]; }
        const n = Object.keys(f).length;
        this.ocrMsgOk = n > 0;
        this.ocrMsg = n ? ('Filled ' + n + ' field(s) — check and Save') : 'Nothing could be read — enter manually';
        this.ocrQueue = [];
      } catch (e) {
        this.ocrMsgOk = false; this.ocrMsg = e.message || 'Scan failed';
      } finally {
        this.ocrBusy = false;
        setTimeout(() => { if (this.ocrMsgOk) this.ocrMsg = ''; }, 9000);
      }
    },

    async loadReportStatus() {
      try {
        const r = await fetch('/spares/api/reorder-report/status');
        if (r.ok) this.report = await r.json();
      } catch (e) { console.warn('report status failed', e); }
    },

    async sendReport() {
      this.reportSending = true; this.reportMsg = '';
      try {
        const r = await fetch('/spares/api/reorder-report/send', { method: 'POST' });
        const d = await r.json();
        const res = (d && d.result) || {};
        this.reportMsgOk = !!(d.ok && res.sent);
        if (res.reorder_count === 0) {
          this.reportMsg = 'Nothing to reorder — no email sent';
        } else if (res.sent) {
          this.reportMsg = 'Sent — ' + res.reorder_count + ' part(s) to ' + (res.to || 'maintenance');
        } else {
          this.reportMsg = 'Send failed — check email settings';
        }
        if (d && d.status) this.report = d.status;
      } catch (e) {
        this.reportMsgOk = false; this.reportMsg = 'Send failed';
      } finally {
        this.reportSending = false;
        setTimeout(() => { this.reportMsg = ''; }, 8000);
      }
    },

    async load() {
      const p = new URLSearchParams();
      if (this.q) p.set('q', this.q);
      if (this.onlyReorder) p.set('reorder', '1');
      try {
        const r = await fetch('/spares/api/list?' + p.toString());
        const d = await r.json();
        this.rows = d.rows || [];
        this.totals = d.totals || {};
      } catch (e) { console.warn('load failed', e); }
    },

    blank() {
      return { id: null, part_name: '', part_code: '', machine: '', manufacturer: '',
               unit: '', supplier: '', store_location: '', opening_qty: 0, min_stock_level: 0,
               qty_in: 0, qty_out: 0, unit_price: 0, last_purchase_date: '' };
    },
    openAdd() { this.form = this.blank(); this.formErr = ''; this.clearOcrQueue(); this.showForm = true; },
    openEdit(r) {
      this.form = { id: r.id, part_name: r.part_name, part_code: r.part_code || '',
        machine: r.machine || '', manufacturer: r.manufacturer || '', unit: r.unit || '',
        supplier: r.supplier || '', store_location: r.store_location || '', opening_qty: r.opening_qty, min_stock_level: r.min_stock_level,
        qty_in: r.qty_in, qty_out: r.qty_out, unit_price: r.unit_price,
        last_purchase_date: r.last_purchase_date || '' };
      this.formErr = ''; this.clearOcrQueue(); this.showForm = true;
    },
    async save() {
      if (!this.form.part_name.trim()) { this.formErr = 'Part name is required'; return; }
      this.saving = true; this.formErr = '';
      try {
        const url = '/spares/api/save' + (this.form.id ? ('?pid=' + this.form.id) : '');
        const r = await fetch(url, { method: 'POST',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.form) });
        if (!r.ok) { this.formErr = (await r.json()).detail || 'Save failed'; return; }
        this.showForm = false; await this.load();
      } catch (e) { this.formErr = 'Save failed'; }
      finally { this.saving = false; }
    },

    openMove(r, dir) {
      this.move = { id: r.id, part_name: r.part_name, current: r.current_stock,
        direction: dir, qty: null, unit_price: r.unit_price || null, purchase_date: '' };
      this.moveErr = ''; this.showMove = true;
    },
    async doMove() {
      if (!this.move.qty || this.move.qty <= 0) { this.moveErr = 'Enter a quantity'; return; }
      this.saving = true; this.moveErr = '';
      try {
        const body = { direction: this.move.direction, qty: this.move.qty };
        if (this.move.direction === 'in') { body.unit_price = this.move.unit_price; body.purchase_date = this.move.purchase_date; }
        const r = await fetch('/spares/api/' + this.move.id + '/move', { method: 'POST',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!r.ok) { this.moveErr = (await r.json()).detail || 'Failed'; return; }
        this.showMove = false; await this.load();
      } catch (e) { this.moveErr = 'Failed'; }
      finally { this.saving = false; }
    },

    async del(r) {
      if (!confirm('Remove "' + r.part_name + '" from the inventory?')) return;
      await fetch('/spares/api/' + r.id + '/delete', { method: 'POST' });
      await this.load();
    },
  };
}
</script>
