{% extends "base.html" %}
{% block title %}Code Books — Metfraa Portal{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-data="codeBooks()" x-init="init()" x-cloak>

  <div class="mb-6 flex items-start justify-between gap-4">
    <div>
      <div class="lbl mb-2">Metfraa Portal</div>
      <h1 class="display display-xl text-4xl text-metfraa-ink leading-none">Code Books</h1>
      <p class="text-sm text-metfraa-gray-500 mt-2">Design standards &amp; reference codes — IS, ASCE, AISC. View in browser or download.</p>
    </div>
    <a href="/" class="shrink-0 text-sm font-semibold text-metfraa-gray-500 hover:text-metfraa-blue">← Home</a>
  </div>

  <!-- admin: add -->
  <template x-if="canEdit">
    <details class="mb-6 bg-white rounded-xl ring-1 ring-metfraa-gray-200 p-4">
      <summary class="cursor-pointer text-sm font-semibold text-metfraa-ink">+ Add code books</summary>
      <div class="mt-3 space-y-2">
        <p class="text-xs text-metfraa-gray-500">Paste one link per line. Optional format: <code>Title | URL | Category</code>. A bare URL works too — the title is taken from the file name and the category defaults to “Code Books”.</p>
        <textarea x-model="addText" rows="5" placeholder="IS 800 | https://xxxx.public.blob.vercel-storage.com/code-books/800.pdf | IS codes"
                  class="w-full rounded-lg border-metfraa-gray-300 text-sm font-mono"></textarea>
        <div class="flex items-center gap-3">
          <button @click="add()" :disabled="busy" class="navy text-white text-sm font-bold px-4 py-2 rounded-lg disabled:opacity-50"
                  style="background:#0A2B66"><span x-show="!busy">Add</span><span x-show="busy">Adding…</span></button>
          <span x-show="err" class="text-sm text-red-600" x-text="err"></span>
        </div>
      </div>
    </details>
  </template>

  <div x-show="groups.length===0" class="text-sm text-metfraa-gray-400 bg-white rounded-xl ring-1 ring-metfraa-gray-200 p-6 text-center">
    No code books yet.<template x-if="canEdit"><span> Use “Add code books” above.</span></template>
  </div>

  <template x-for="g in groups" :key="g.category">
    <div class="mb-6">
      <div class="text-[11px] font-semibold uppercase tracking-wide text-metfraa-gray-400 mb-2" x-text="g.category"></div>
      <div class="bg-white rounded-xl ring-1 ring-metfraa-gray-200 divide-y divide-metfraa-gray-100">
        <template x-for="it in g.items" :key="it.id">
          <div class="flex items-center gap-3 px-4 py-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-metfraa-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 3v5h5"/></svg>
            <a :href="it.url" target="_blank" rel="noopener" class="flex-1 text-sm font-medium text-metfraa-ink hover:text-metfraa-blue truncate" x-text="it.title"></a>
            <a :href="it.url" target="_blank" rel="noopener"
               class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg ring-1 ring-metfraa-gray-200 text-xs font-semibold text-metfraa-gray-600 hover:text-metfraa-blue hover:ring-metfraa-blue">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S5.5 5.5 12 5.5 21.5 12 21.5 12 18.5 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/></svg>View</a>
            <a :href="dl(it.url)"
               class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg ring-1 ring-metfraa-gray-200 text-xs font-semibold text-metfraa-gray-600 hover:text-metfraa-blue hover:ring-metfraa-blue">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Download</a>
            <template x-if="canEdit">
              <button @click="del(it)" title="Remove" class="p-1 text-metfraa-gray-300 hover:text-red-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-7 0v12a1 1 0 001 1h6a1 1 0 001-1V7"/></svg></button>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script>
  function codeBooks(){
    return {
      groups: [], canEdit: false, addText: '', busy: false, err: '',
      async init(){ await this.load(); },
      async load(){
        try{ const r = await fetch('/code-books/api/list'); if(r.ok){ const d = await r.json(); this.groups = d.groups||[]; this.canEdit = !!d.can_edit; } }catch(e){}
      },
      dl(u){ return u + (u.includes('?') ? '&' : '?') + 'download=1'; },
      async add(){
        if(!this.addText.trim()){ this.err='Paste at least one URL.'; return; }
        this.busy = true; this.err = '';
        try{
          const r = await fetch('/code-books/api/add', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text: this.addText})});
          const d = await r.json();
          if(r.ok){ this.addText=''; if(window.toast) toast('Added '+d.added, 'success'); await this.load(); }
          else { this.err = d.detail || 'Could not add.'; }
        }catch(e){ this.err = 'Could not add.'; }
        this.busy = false;
      },
      async del(it){
        if(!confirm('Remove "'+it.title+'"?')) return;
        try{ await fetch('/code-books/api/'+it.id+'/delete', {method:'POST'}); await this.load(); }catch(e){}
      },
    };
  }
</script>
{% endblock %}
