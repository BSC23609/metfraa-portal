<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charts — Metfraa EHS</title>
  <link rel="icon" type="image/png" href="/ehs/img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ehs/css/app.css">
  <link rel="stylesheet" href="/ehs/css/admin-dashboard.css">
  <link rel="stylesheet" href="/ehs/css/admin-charts.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="/ehs/" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;">
        <img src="/ehs/img/logo.png?v=2" alt="Metfraa" class="app-header__logo">
        <div>
          <h1 class="app-header__title">EHS Portal</h1>
          <div class="app-header__sub">Project Charts</div>
        </div>
      </a>
      <div class="app-header__spacer"></div>
      <div id="user-pill"></div>
      <a href="/ehs/" class="app-header__btn">All Forms</a>
      <a href="/ehs/submissions" class="app-header__btn">Submissions</a>
      <a href="/ehs/admin-dashboard" class="app-header__btn">Dashboard</a>
      <a href="/ehs/admin-settings" class="app-header__btn">Settings</a>
      <a href="/dashboard" class="app-header__btn app-header__btn--home">&larr; Main Dashboard</a>
      <a href="/auth/logout" class="app-header__btn">Logout</a>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h2 class="page-title">Project Charts</h2>
        <p class="page-subtitle" id="range-subtitle">Loading…</p>
      </div>
      <button id="refresh-btn" class="btn-secondary" type="button">↻ Refresh</button>
    </div>

    <!-- Date range picker with presets -->
    <div class="filter-bar">
      <div class="filter-field">
        <label>From date</label>
        <input type="date" id="filter-start">
      </div>
      <div class="filter-field">
        <label>To date</label>
        <input type="date" id="filter-end">
      </div>
      <div class="filter-field">
        <label>Project</label>
        <select id="filter-project">
          <option value="">All projects</option>
        </select>
      </div>
      <div class="filter-field" style="flex:0 0 auto;">
        <label>Quick presets</label>
        <div class="preset-buttons">
          <button class="preset-btn" data-preset="today">Today</button>
          <button class="preset-btn" data-preset="yesterday">Yesterday</button>
          <button class="preset-btn" data-preset="this-week">This Week</button>
          <button class="preset-btn" data-preset="this-month">This Month</button>
          <button class="preset-btn" data-preset="this-year">This Year</button>
        </div>
      </div>
      <button id="apply-range" class="btn-submit btn-submit--small" type="button">Apply</button>
    </div>

    <!-- View mode selector + pagination -->
    <div class="view-toolbar">
      <div class="view-modes" role="tablist" aria-label="Grid view">
        <button class="view-mode-btn" data-view="1x1" title="One chart at a time" aria-label="1 by 1 grid">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>1×1</span>
        </button>
        <button class="view-mode-btn" data-view="2x1" title="Two charts side-by-side" aria-label="2 by 1 grid">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="6" width="8" height="12" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="13" y="6" width="8" height="12" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>2×1</span>
        </button>
        <button class="view-mode-btn" data-view="2x2" title="Four charts in a 2 by 2 grid" aria-label="2 by 2 grid">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>2×2</span>
        </button>
        <button class="view-mode-btn view-mode-btn--active" data-view="3x2" title="All six tiles" aria-label="3 by 2 grid">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="4" width="6" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/><rect x="9" y="4" width="6" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/><rect x="16" y="4" width="6" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/><rect x="2" y="13" width="6" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/><rect x="9" y="13" width="6" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/><rect x="16" y="13" width="6" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>3×2</span>
        </button>
      </div>
      <div class="view-pager" id="view-pager" style="display:none;">
        <button class="pager-btn" id="pager-prev" type="button" aria-label="Previous page">←</button>
        <span class="pager-status" id="pager-status">Page 1 of 1</span>
        <button class="pager-btn" id="pager-next" type="button" aria-label="Next page">→</button>
      </div>
    </div>

    <div id="charts-mount">
      <div class="loading">Loading charts…</div>
    </div>
  </main>

  <script src="/ehs/js/admin-charts.js"></script>
</body>
</html>
